spring.application.name=sejuega-backend
spring.config.import=optional:file:../variables-entorno/backend.env[.properties]

# Puerto del servidor (Coolify suele exponer PORT; en local sigue valiendo SERVER_PORT)
server.port=${SERVER_PORT:${PORT:8080}}

# ============ BASE DE DATOS - TODAS LAS VARIABLES REQUERIDAS ============
# NO hay defaults - todas deben estar en variables-entorno/backend.env o env del sistema
spring.datasource.url=${CORE_DB_URL}
spring.datasource.username=${CORE_DB_USER}
spring.datasource.password=${CORE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ JPA / HIBERNATE ============
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ============ HARDENING RESPUESTAS ============
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# ============ CORS ============
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allow-wildcard=${CORS_ALLOW_WILDCARD:false}

# ============ RATE LIMIT (anti abuso/bruteforce) ============
security.rate-limit.enabled=${SECURITY_RATE_LIMIT_ENABLED:true}
security.rate-limit.requests-per-minute=${SECURITY_RATE_LIMIT_REQUESTS_PER_MINUTE:120}
security.rate-limit.strict.requests-per-minute=${SECURITY_RATE_LIMIT_STRICT_REQUESTS_PER_MINUTE:10}
security.rate-limit.strict.path-prefixes=${SECURITY_RATE_LIMIT_STRICT_PATH_PREFIXES:/api/usuarios/me,/api/auth}
security.rate-limit.trust-proxy-headers=${SECURITY_RATE_LIMIT_TRUST_PROXY_HEADERS:false}
security.rate-limit.cleanup-every=${SECURITY_RATE_LIMIT_CLEANUP_EVERY:500}

# ============ AUTENTICACIÓN & SEGURIDAD - TODAS LAS VARIABLES REQUERIDAS ============
# NO hay defaults - todas deben estar en variables-entorno/backend.env o env del sistema
auth.mode=firebase
auth.dev-header.enabled=false
auth.firebase.enabled=true
auth.firebase.project-id=${FIREBASE_PROJECT_ID}
auth.firebase.credentials-json=${AUTH_FIREBASE_CREDENTIALS_JSON:}
auth.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:../variables-entorno/firebase-service-account.json}
auth.firebase.fail-fast=true
auth.firebase.check-revoked=${FIREBASE_CHECK_REVOKED:false}